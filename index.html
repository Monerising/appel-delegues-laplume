<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#130f11">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Fiches d'appel</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #130f11; --surface: #1c1518; --ink: #f3ebe8; --muted: #ac9a9e;
    --accent: #7b1e30; --accent-hover: #912a3f; --accent-ink: #ffffff;
    --soft: #e2b8c0; --line: #35282c; --gold: #c8a96a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 30rem; margin: 0 auto;
    padding: max(2rem, env(safe-area-inset-top)) 1.25rem max(3rem, env(safe-area-inset-bottom)); }
  .date { color: var(--gold); margin: 0 0 .5rem; font-size: .9rem; letter-spacing: .02em; }
  h1 { font: 600 2rem/1.15 Georgia, "Iowan Old Style", serif; margin: 0 0 .5rem; }
  .intro { color: var(--muted); margin: 0 0 1.75rem; max-width: 34ch; }
  .btn:focus-visible, .card:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  .cards { display: grid; gap: .75rem; }
  .card { display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    min-height: 4rem; padding: .9rem 1.1rem; border-radius: .75rem;
    background: var(--surface); border: 1.5px solid var(--line);
    color: var(--ink); text-decoration: none; font-weight: 600; font-size: 1.05rem; }
  .card:hover { border-color: var(--accent-hover); background: #231a1e; }
  .card .arrow { color: var(--gold); font-size: 1.25rem; }
</style>
</head>
<body>
<main>
  <p class="date" id="date"></p>
  <h1>Fiches d'appel</h1>
  <p class="intro">Choisis ta classe pour accéder à la fiche d'appel du jour.</p>
  <nav class="cards" aria-label="Classes">
    <a class="card" href="fiche-appel-fiqh-1.html"><span>Fiqh 1 / Culture musulmane</span><span class="arrow" aria-hidden="true">→</span></a>
    <a class="card" href="fiche-appel-fiqh-2.html"><span>Fiqh 2ème année</span><span class="arrow" aria-hidden="true">→</span></a>
    <a class="card" href="fiche-appel-fiqh-3.html"><span>Fiqh 3ème année</span><span class="arrow" aria-hidden="true">→</span></a>
    <a class="card" href="fiche-appel-fiqh-4.html"><span>Fiqh 4ème année</span><span class="arrow" aria-hidden="true">→</span></a>
  </nav>
</main>
<script>
  const d = new Date().toLocaleDateString("fr-FR",
    { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  document.getElementById("date").textContent = d.charAt(0).toUpperCase() + d.slice(1);
</script>
</body>
</html>
